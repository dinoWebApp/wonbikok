      q1_question: "우리 공부방도 현금영수증을 발급해야 하나요?"
      q1_answer: "교습소·공부방은 의무발행 업종입니다. 10만 원 이상 계좌이체 수강료가 해당되며, 원비콕은 발급을 자동으로 처리합니다."
      q2_question: "학부모 주민번호를 모두 입력해야 하나요?"
      q2_answer: "아니요. 소득공제용 현금영수증은 보호자 휴대폰번호 기준으로 발급됩니다. 주민번호는 수집하지 않습니다."
      q3_question: "홈택스에 접속하거나 공동인증서가 필요한가요?"
      q3_answer: "아니요. 연동 후에는 체크 한 번으로 발행과 신고가 처리됩니다."
      q4_question: "학부모가 카카오톡을 안 쓰면 어떻게 되나요?"
      q4_answer: "알림톡 발송 실패 시 자동으로 문자(SMS)로 대체 발송됩니다."
      q5_question: "입금은 자동으로 확인되나요?"
      q5_answer: "현재는 원장님이 체크로 확인합니다(통장 대조 없이 리스트에서 바로). 자동 확인 기능은 준비 중입니다."
      q6_question: "해지는 언제든 가능한가요?"
      q6_answer: "월 구독은 매월 단위로 해지 가능하며, 해지 전 원생·발행 이력을 내려받을 수 있습니다."
      q7_question: "원생이 70명 이상인데 쓸 수 있나요?"
      q7_answer: "원비콕은 50명 이하 소규모 원에 최적화되어 있어 최대 70명까지만 지원합니다. 대규모 원은 학원 전용 솔루션이 적합합니다."
      q8_question: "체험 종료 후 데이터는 어떻게 되나요?"
      q8_answer: "결제하지 않아도 30일간 데이터를 보관하며, 그동안 언제든 내려받을 수 있습니다."
